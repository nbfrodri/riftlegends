		:root {
			--ground: #101420;
			--surface: #191f2f;
			--raised: #222b3e;
			--ink: #f4f6ff;
			--muted: #b6c0d2;
			--accent: #a8deff;
			--line: #3c455b;
			--paper: #e7ebf4;
			--display: 'Unbounded', sans-serif;
			color-scheme: dark;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			background: var(--ground);
			color: var(--ink);
			font: 400 16px/1.5 'Archivo', sans-serif;
			font-variant-numeric: tabular-nums;
		}
		h1, h2, h3, p, figure { margin: 0; }
		h1, h2, h3 { font: 700 1.2rem/1.25 var(--display); letter-spacing: -.025em; }
		h1 { font-size: clamp(1.9rem, 3.5vw, 3.8rem); }
		h2 { font-size: clamp(1.15rem, 2vw, 1.55rem); }
		p { color: var(--muted); }
		a { color: var(--accent); text-underline-offset: .22em; }
		a:hover { color: var(--ink); }
		:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
		.page-width { width: min(100% - 40px, 1440px); margin-inline: auto; }
		.masthead { border-bottom: 1px solid var(--line); }
		.masthead .page-width {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: space-between;
			gap: 8px 24px;
			padding-block: 13px;
		}
		.wordmark { font: 700 .85rem var(--display); }
		.masthead nav { display: flex; gap: 20px; font-size: .875rem; }
		.masthead a { color: var(--muted); }
		.masthead a:hover { color: var(--ink); }
		.intro { padding-block: clamp(30px, 6vw, 75px) 26px; }
		.intro p { max-width: 58ch; margin-top: 11px; }
		.scale-controls {
			display: flex;
			align-items: start;
			justify-content: space-between;
			flex-wrap: wrap;
			gap: 9px 20px;
			margin-bottom: 12px;
		}
		.scale-controls fieldset { min-width: 0; border: 0; padding: 0; margin: 0; }
		.scale-controls legend { float: left; padding: 7px 13px 7px 0; font-size: .875rem; color: var(--muted); }
		.sizes { display: flex; flex-wrap: wrap; gap: 4px; }
		.size { position: relative; }
		.size input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
		.size span { display: block; min-width: 41px; padding: 5px 8px; text-align: center; border: 1px solid var(--line); border-radius: 2px; font-size: .875rem; }
		.size input:hover + span { background: var(--raised); }
		.size input:checked + span { background: var(--accent); border-color: var(--accent); color: #101828; font-weight: 700; }
		.size input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
		.scale-note { font-size: .875rem; padding-block: 6px; }
		.preview-options { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
		.zoom { display: flex; align-items: center; gap: 7px; font-size: .875rem; cursor: pointer; }
		.zoom:has(input:disabled) { color: var(--muted); cursor: default; }
		.zoom input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

		.concepts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 285px), 1fr)); gap: 22px 12px; }
		.concepts[data-large], .concepts.zoomed[data-wide] { grid-template-columns: 1fr; }
		.concepts.zoomed:not([data-wide]) { grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }
		.zoomed .stage img { width: var(--preview-size); height: var(--preview-size); image-rendering: pixelated; }
		.scale-title { margin-bottom: 12px; }
		.concept { min-width: 0; }
		.fields { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); border: 1px solid var(--line); }
		.field {
			flex: 1 1 min(100%, calc(var(--preview-size) + 16px));
			min-width: 0;
			margin: 0;
			display: flex;
			flex-direction: column;
			background: #0c101b;
		}
		.field.light { background: var(--paper); color: #222b3e; }
		.field figcaption { padding: 6px 8px 0; font-size: .75rem; font-weight: 550; color: var(--muted); }
		.field.light figcaption { color: #3c455b; }
		.stage {
			display: flex;
			min-height: max(116px, calc(var(--preview-size) + 20px));
			padding: 8px 0 12px;
			overflow: auto;
		}
		.stage img { display: block; flex: 0 0 auto; margin: auto; }
		.concept-copy { padding: 13px 0 1px; }
		.concept-head { display: flex; gap: 3px 10px; justify-content: space-between; align-items: baseline; flex-wrap: wrap; }
		.concept-head a { font-size: .75rem; font-weight: 550; }
		.concept-copy p { font-size: .875rem; margin-top: 5px; max-width: 48ch; }
		.concepts[data-large] .concept { border-bottom: 1px solid var(--line); padding-bottom: 14px; }
		.concepts[data-large] .concept:first-child { border-top: 1px solid var(--line); }
		.concepts[data-large] .concept-copy { padding: 12px 0; }

		.original-concepts, .desk { margin-top: clamp(30px, 5vw, 62px); }
		.desk > h2, .original-concepts > h2 { margin-bottom: 12px; }
		.desk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 12px; }
		.desktop {
			display: grid;
			align-content: space-between;
			min-height: 146px;
			border: 1px solid var(--line);
			background: var(--surface);
		}
		.desktop-head {
			display: flex;
			gap: 8px 16px;
			flex-wrap: wrap;
			justify-content: space-between;
			justify-self: stretch;
			align-self: start;
			padding: 10px 14px;
			font-size: .875rem;
			color: var(--muted);
		}
		.desktop-head strong { color: var(--ink); font-weight: 600; }
		.taskbar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; background: #0c101b; padding: 9px 12px; border-top: 1px solid var(--line); }
		.taskbar svg { color: var(--muted); display: block; }
		.taskbar time { justify-self: end; color: var(--muted); font-size: .75rem; }
		.task-icons, .launcher { margin: 0; padding: 0; list-style: none; }
		.task-icons { display: flex; gap: clamp(3px, 1vw, 14px); }
		.task-icons li { display: grid; place-items: center; width: 38px; height: 41px; border-bottom: 2px solid var(--line); }
		.task-icons img, .launcher img { display: block; }
		.launcher {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 2px;
			padding: 6px 8px 8px;
			background: var(--raised);
			border-top: 1px solid var(--line);
		}
		.launcher li { display: grid; justify-items: center; gap: 3px; min-width: 0; padding: 2px 0; font-size: .75rem; }
		.desk { margin-bottom: 36px; }
		@media (max-width: 1190px) {
			.concepts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
		}
		@media (max-width: 640px) {
			.page-width { width: calc(100% - 24px); }
			.concepts { grid-template-columns: 1fr; }
			.taskbar { grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); padding-inline: 6px; }
		}
	</style>
</head>

	<script>
		const concepts = [
			{id: 'corte-antes', name: 'Corte original', description: 'El coral cubre parte del pie de la R.'},
			{id: 'corte', name: 'Corte refinado', description: 'Versión recomendada. El coral cubre toda la pata desde el hombro.', desktop: 'Corte'},
			{id: 'banda', name: 'Banda oblicua', description: 'Una franja coral cruza la pata y deja el pie blanco.'},
			{id: 'puntera', name: 'Puntera', description: 'El coral cubre la base de la pata con un remate horizontal.'},
		];
		const otherConcepts = [
			{id: 'torres', name: 'Torres', description: 'Los dos lados del draft flanquean la placa central.', desktop: 'Torres'},
			{id: 'pulso', name: 'Pulso', description: 'La forma de onda de un monitor de señal en la cabina.', desktop: 'Pulso'},
			{id: 'placa', name: 'Placa', description: 'Las iniciales RL en una cartela horizontal de retransmisión.', desktop: 'Placa'},
		];
		const rasters = JSON.parse(document.querySelector('#rasters').textContent);
		const comparison = document.querySelector('#concepts');
		const archive = document.querySelector('#original-concepts');
		const zoom = document.querySelector('#pixel-zoom');
		const template = document.querySelector('#concept-template');
		const scaleNote = document.querySelector('#scale-note');
		const allConcepts = [...concepts, ...otherConcepts];

		function setImage(image, id, size, description = '') {
			image.width = image.height = size;
			image.alt = description;
			image.src = rasters[id][size];
		}

		for (const concept of allConcepts) {
			const tile = template.content.firstElementChild.cloneNode(true);
			const title = tile.querySelector('h3');
			title.id = concept.id;
			title.textContent = concept.name;
			tile.setAttribute('aria-labelledby', title.id);
			tile.querySelector('p').textContent = concept.description;
			for (const stage of tile.querySelectorAll('.stage')) {
				stage.setAttribute('role', 'group');
				stage.setAttribute('aria-label', concept.name + ', ' + stage.previousElementSibling.textContent.toLowerCase());
				stage.append(document.createElement('img'));
			}
			(concepts.includes(concept) ? comparison : archive).append(tile);
			concept.tile = tile;

			if (!concept.desktop) continue;
			const task = document.createElement('li');
			task.title = concept.desktop;
			const taskIcon = document.createElement('img');
			setImage(taskIcon, concept.id, 32, concept.desktop);
			task.append(taskIcon);
			document.querySelector('#task-icons').append(task);

			const entry = document.createElement('li');
			const launcherIcon = document.createElement('img');
			const caption = document.createElement('span');
			setImage(launcherIcon, concept.id, 48);
			caption.textContent = concept.desktop;
			entry.append(launcherIcon, caption);
			document.querySelector('#launcher').append(entry);
		}

		const stages = document.querySelectorAll('.stage');

		function updateScrollablePreviews() {
			for (const stage of stages) stage.tabIndex = stage.scrollWidth > stage.clientWidth ? 0 : -1;
		}

		function showSize() {
			const size = Number(document.querySelector('input[name="size"]:checked').value);
			zoom.disabled = size > 48;
			const magnified = zoom.checked && !zoom.disabled;
			const previewSize = magnified ? size * 8 : size;
			comparison.classList.toggle('zoomed', magnified);
			comparison.toggleAttribute('data-wide', magnified && size === 48);
			comparison.style.setProperty('--preview-size', previewSize + 'px');
			archive.style.setProperty('--preview-size', size + 'px');
			for (const grid of [comparison, archive]) grid.toggleAttribute('data-large', size >= 256);
			scaleNote.textContent = size + ' × ' + size + (magnified ? ' a escala 8:1' : ' a escala 1:1');

			for (const {id, name, tile} of allConcepts) {
				for (const image of tile.querySelectorAll('.stage img')) setImage(image, id, size, 'Icono ' + name);
				const link = tile.querySelector('a');
				link.href = rasters[id][size];
				link.download = 'rift-legends-' + id + '-' + size + '.png';
				link.setAttribute('aria-label', 'Descargar ' + name + ' en PNG de ' + size + ' píxeles');
			}
			updateScrollablePreviews();
		}

		document.querySelector('fieldset').addEventListener('change', showSize);
		zoom.addEventListener('change', showSize);
		window.addEventListener('resize', updateScrollablePreviews);
		showSize();
	</script>
</body>
</html>
