name: Bug
description: Algo no funciona como debería
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes: {label: Qué pasa, description: "Comportamiento observado frente al esperado"}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Cómo reproducirlo, description: "Pasos, semilla de la carrera y versión del juego/contenido"}
    validations: {required: true}
  - type: dropdown
    id: os
    attributes: {label: Sistema, options: ["Windows", "Linux (Wayland)", "Linux (X11)", "Ambos"]}
  - type: textarea
    id: logs
    attributes: {label: Logs o capturas, render: text}
