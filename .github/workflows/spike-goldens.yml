name: Spike goldens

on:
  push:
    branches: ["spike/**"]

permissions:
  contents: read

jobs:
  goldens:
    name: T4 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Locate pnpm store
        id: store
        shell: bash
        run: |
          store_path=$(pnpm store path)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --project core packages/core/test/series-golden.test.ts --reporter=verbose
