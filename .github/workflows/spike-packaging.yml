name: Spike packaging
on:
  push:
    branches: ["spike/**"]

permissions:
  contents: read

jobs:
  nsis:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: pnpm install --frozen-lockfile
      - run: node apps/desktop/spike76/build.mjs 0.76.1
      - run: node apps/desktop/spike76/build.mjs 0.76.2
      - name: Install A, recover, replace with B and continue Linux career
        run: ./apps/desktop/spike76/windows-smoke.ps1
      - name: Resumable Data Dragon download (T7)
        run: ./apps/desktop/spike77/windows-download.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nsis-and-evidence-${{ github.sha }}
          path: |
            release/*/RiftLegends-*.exe
            release/windows-evidence
            release/windows-evidence-77
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-${{ github.sha }}
          path: |
            release/windows-evidence
            release/windows-evidence-77
          retention-days: 7
