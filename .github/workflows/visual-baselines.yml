name: Visual baselines

# Regenerates the screenshot baselines on the same image the CI compares them
# on (ubuntu-latest under Xvfb). It never commits: it uploads the files as an
# artifact for a human to review and commit. See apps/desktop/e2e/visual/README.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Locate pnpm store
        id: store
        shell: bash
        run: |
          store_path=$(pnpm store path)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Enable Electron's Chromium sandbox helper
        run: |
          pnpm --filter @rift-legends/desktop exec install-electron
          sandbox="$(pnpm --filter @rift-legends/desktop exec node -p "require('node:path').join(require('node:path').dirname(require('electron')), 'chrome-sandbox')")"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      # "all": small text changes stay under maxDiffPixelRatio and would keep a stale baseline.
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" pnpm e2e:visual probe --update-snapshots=all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: apps/desktop/e2e/visual/__screenshots__
          if-no-files-found: error
          retention-days: 7
